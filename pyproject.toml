[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "preprocess"
version = "0.1.0"
description = "The missing data preprocessing library for LLM/VLM SFT/RL."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    # io
    "datasets[vision]<4.8",
    "pandas[excel]",
    "seaborn",
    # processing
    "scikit-learn>=1.8.0",
    "pycnnum",
    "openai",
    # interaction & friendly ui
    "typer",
]

[project.optional-dependencies]
openslide = [
    "openslide-python",
    "openslide-bin",
]
jupyter = [
    "ipykernel",
]
